name: Auto-assign new issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    steps:
      - name: Assign issue to maintainer
        uses: actions/github-script@v7
        with:
          script: |
            const assignees = ['EslaM-X'];
            const issue = context.payload.issue;
            if (!issue || (issue.assignees && issue.assignees.length > 0)) {
              core.info('Issue already assigned or missing payload; skipping.');
              return;
            }
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              assignees
            });
            core.info(`Assigned issue #${issue.number} to ${assignees.join(', ')}`);
